<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body style="background-image: url(multiplayerbg.jpg)">
    <nav>
      <ul>
        <li>Multiplayer Tic-Tac-Toe Game</li>
      </ul>
    </nav>
    <div
      class="gameContainer"
      style="position: relative; top: -40px; left: -110px"
    >
      <div class="container">
        <div class="line"></div>
        <div class="box bt-0 bl-0"><span class="boxtext"></span></div>
        <div class="box bt-0"><span class="boxtext"></span></div>
        <div class="box bt-0 br-0"><span class="boxtext"></span></div>
        <div class="box bl-0"><span class="boxtext"></span></div>
        <div class="box"><span class="boxtext"></span></div>
        <div class="box br-0"><span class="boxtext"></span></div>
        <div class="box bl-0 bb-0"><span class="boxtext"></span></div>
        <div class="box bb-0"><span class="boxtext"></span></div>
        <div class="box bb-0 br-0"><span class="boxtext"></span></div>
      </div>
      <div class="gameInfo">
        <h1 style="position: relative; top: 10px; left: 200px">
          <b>Welcome to the game</b>
        </h1>
        <br /><br /><br /><br />
        <div>
          <span style="position: relative; top: 10px; left: 250px" class="info"
            >Turn for X</span
          >

          <button
            style="position: relative; top: 500px; left: 500px"
            id="reset"
          >
            Reset
          </button>
        </div>
        <div class="imgbox">
          <img
            style="position: relative; top: 155px; left: 360px"
            src="excited.gif"
            alt=" "
            srcset=""
          />
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
